<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CineStream</title>
<meta name="theme-color" content="#95FF50" />
<meta name="description" content="Stream thousands of movies & TV shows — CineStream." />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { bg:'#050505', surface:'#121212', surface2:'#1a1a1a', accent:'#95FF50', muted:'#9aa0a6' },
      fontFamily: { head:['Montserrat','sans-serif'], body:['Inter','sans-serif'] },
    }
  }
}
</script>
<style>
  html{background:#050505}
  body{background:transparent;color:#fff;font-family:'Inter',sans-serif}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}
  .no-sb::-webkit-scrollbar{display:none}
  .no-sb{-ms-overflow-style:none;scrollbar-width:none}
  .row-scroll{scroll-behavior:smooth}
  .card:hover{transform:scale(1.04)}
  .card{transition:transform .18s ease}
  .continue-section.editing .continue-card{animation:card-wiggle .28s ease-in-out infinite alternate}
  .continue-section.editing .continue-remove{display:grid}
  .continue-section.editing .editing-chevron{display:block}
  .continue-section.editing .continue-link{pointer-events:none}
  @keyframes card-wiggle{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
  .fade-in{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .skel{background:linear-gradient(90deg,#161616 25%,#222 37%,#161616 63%);background-size:400% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .safe-b{padding-bottom:env(safe-area-inset-bottom)}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  /* ===== HERO CAROUSEL (Cinejoy-style seamless image→black dissolve) ===== */
  .hero-stage{position:relative;height:118vh;min-height:820px;width:100%}
  @media (max-width:768px){.hero-stage{height:105vh;min-height:700px}}
  /* Pull the catalogue over the extended backdrop so the artwork flows behind it. */
  #rows{margin-top:-46vh!important;padding-top:2.5rem}
  @media (max-width:768px){#rows{margin-top:-35vh!important}}
  .hslide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
  .hslide.active{opacity:1;pointer-events:auto}
  .hslide-img{position:absolute;inset:0;overflow:hidden}
  .hslide-img{position:absolute;inset:0;overflow:hidden}
  .hslide-img img{width:100%;height:100%;object-fit:cover;object-position:top center;
    -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 48%, rgba(0,0,0,.88) 64%, rgba(0,0,0,.42) 84%, transparent 100%);
    mask-image:linear-gradient(to bottom, #000 0%, #000 48%, rgba(0,0,0,.88) 64%, rgba(0,0,0,.42) 84%, transparent 100%)}
  @media (min-width:768px){.hslide-img img{object-position:top right}}
  /* left gradient for text readability — masked to fade out at the bottom like the image, so no seam line */
  .hslide-fadeL{position:absolute;inset:0;background:
    linear-gradient(to bottom,transparent 42%,rgba(5,5,5,.12) 58%,rgba(5,5,5,.52) 82%,rgba(5,5,5,.92) 100%),
    linear-gradient(to right,rgba(5,5,5,.72) 0%,rgba(5,5,5,.25) 34%,rgba(5,5,5,0) 62%);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 92%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 0%,#000 92%,transparent 100%)}
  .hslide-fadeB{background:none}
  @media (max-width:768px){.hslide-fadeL{background:linear-gradient(to right,rgba(5,5,5,.5),rgba(5,5,5,0) 80%)}}
  .nav-active{background:#fff !important;color:#0a0a0a !important;font-weight:600}
  /* Page-wide color wash: fixed layer behind all content, tinted from the hero image.
     Sits above the base black bg but below content; the hero color bleeds down the page. */
  #pageWash{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--wash);transition:background-color .8s ease}
  #pageWash .page-wash-img{position:absolute;inset:-45px;width:calc(100% + 90px);height:calc(100% + 90px);object-fit:cover;object-position:top center;filter:blur(38px) brightness(.42) saturate(1.18);transform:scale(1.06);opacity:.82;transition:opacity .8s ease}
  #pageWash::after{content:'';position:absolute;inset:0;background:rgba(5,5,5,.22)}
  :root{--wash:#0d1420}
  #topnav, #app{position:relative;z-index:10}
  /* top nav stays fully clear over the hero */
  #topnav{background:transparent}
  /* Shared hero carousel progress dots — used by Home, Movies and Shows. */
  .hero-dots{position:absolute;bottom:calc(48vh + 22px);right:4rem;display:flex;align-items:center;gap:8px;z-index:30}
  .hdot{position:relative;width:8px;height:8px;padding:0;border:0;border-radius:999px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.4);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:width .3s ease,background-color .3s ease}
  .hdot:hover{background:rgba(255,255,255,.65)}
  .hdot.on{width:32px;background:rgba(255,255,255,.3)}
  .hdot.on::after{content:'';display:block;width:100%;height:100%;border-radius:inherit;background:#fff;transform-origin:left center;animation:dot-filling 6s linear forwards}
  @keyframes dot-filling{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (max-width:1023px){.hero-dots{display:none}}
  /* ===== DETAIL HERO: backdrop dissolves directly into page (no blur box) ===== */
  /* The same title backdrop continues behind the full detail page as a blurred image. */
  #dAmbient{display:block;position:fixed;inset:-40px;z-index:0;overflow:hidden;pointer-events:none;background:#050505}
  #dAmbient:empty{display:none}
  #dAmbient .ambient-img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:blur(34px) brightness(.52) saturate(1.15);transform:scale(1.08)}
  #dAmbient::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.2)}
  /* Soft local contrast behind detail copy—no visible glass box or hard edge. */
  .detail-copy{position:relative;isolation:isolate}
  .detail-copy::before{content:'';position:absolute;z-index:-1;inset:-32px -46px;background:radial-gradient(ellipse at 25% 44%,rgba(0,0,0,var(--detail-copy,.52)) 0%,rgba(0,0,0,.34) 48%,rgba(0,0,0,.1) 72%,transparent 88%);filter:blur(16px);pointer-events:none;transition:background .45s ease}
  .detail-copy p{ text-shadow:0 2px 8px rgba(0,0,0,.75) }
  .epctl{font-size:13px;padding:6px 12px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#d5d5d5}
  .epctl:hover{background:rgba(255,255,255,.16)}
  select option{background:#121212;color:#fff;padding:10px}
  .browse-filter{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.12)}
  .browse-filter:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.24)}
  .browse-filter.filter-active{background:rgba(255,255,255,.13);border-color:rgba(149,255,80,.45)}
  .browse-filter.filter-active .filter-label{color:#95FF50}
  .browse-filter.menu-open{z-index:9998;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
  .browse-filter.menu-open .filter-trigger svg{transform:rotate(180deg)}
  .filter-trigger svg{transition:transform .2s ease}
  .filter-option.selected{background:rgba(149,255,80,.12);color:#95FF50}
  .filter-option.selected::after{content:'✓';font-weight:700}
  @media (min-width:768px){
    .browse-filters.filters-docked{position:fixed;left:50%;bottom:22px;z-index:70;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);flex-wrap:nowrap;padding:8px 10px;border-radius:999px;background:rgba(18,18,18,.82);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 55px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(24px) saturate(140%);animation:filterDockIn .24s ease-out}
    .browse-filters.filters-docked .filter-menu{top:auto;bottom:calc(100% + 10px)}
  }
  @keyframes filterDockIn{from{opacity:0;transform:translate(-50%,12px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .search-ambient{position:absolute;top:0;left:0;right:0;height:560px;z-index:0;overflow:hidden;pointer-events:none}
  .search-ambient img{width:100%;height:100%;object-fit:cover;opacity:.85}
  .search-ambient::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,5,.15),rgba(5,5,5,.55) 55%,rgba(5,5,5,.9) 85%,#050505 100%)}
</style>
</head>
<body class="text-white font-body min-h-screen pb-24 md:pb-0">

<!-- page-wide color wash (bleeds the hero image color down the whole page) -->
<div id="pageWash" aria-hidden="true"></div>

<!-- ===== TOP NAV ===== -->
<header id="topnav" class="contents">
    <!-- floating logo: no full-width navbar container -->
    <a href="#/" class="fixed top-5 left-6 lg:left-16 z-40 flex items-center gap-2">
      <span class="grid place-items-center w-9 h-9 rounded-xl bg-accent text-black font-head font-extrabold text-lg drop-shadow-lg">C</span>
      <span class="font-head font-extrabold text-xl tracking-tight hidden lg:block drop-shadow-lg">Cine<span class="text-accent">Stream</span></span>
    </a>

    <!-- floating glass capsule nav -->
    <nav class="hidden md:flex fixed top-5 right-6 lg:right-16 z-40 items-center gap-1 rounded-full px-2 py-1.5 bg-white/[0.07] backdrop-blur-xl backdrop-saturate-150 border border-white/10 shadow-lg shadow-black/10">
      <a href="#/" data-nav="/" class="navlink px-4 py-2 rounded-full text-sm font-medium text-white/75 hover:text-white flex items-center gap-1.5">Home</a>
      <a href="#/category/movie/trending" data-nav="/movie" class="navlink px-4 py-2 rounded-full text-sm font-medium text-white/75 hover:text-white">Movies</a>
      <a href="#/category/tv/trending" data-nav="/tv" class="navlink px-4 py-2 rounded-full text-sm font-medium text-white/75 hover:text-white">Shows</a>

      <span class="w-px h-5 bg-white/20 mx-1"></span>
      <button id="navSearchBtn" onclick="location.hash='#/search'" class="grid place-items-center w-9 h-9 rounded-full text-white/85 hover:bg-white/15">

      </button>
      <button onclick="openPartyHub()" title="Join Watch Party" aria-label="Join Watch Party" class="group/party grid place-items-center w-9 h-9 rounded-full text-white/85 hover:bg-accent hover:text-black transition">

      </a>
    </nav>

    <!-- hidden desktop dropdown search (kept for quick suggest, opens from pill) -->
    <div id="searchDrop" class="hidden"></div>
    <input id="searchInput" type="hidden" />
</header>

<!-- ===== APP ROOT ===== -->
<main id="app" class="min-h-screen"></main>

  <div class="grid grid-cols-7 items-center h-16 px-2 rounded-[28px] bg-[#241713]/90 backdrop-blur-2xl border border-white/10 shadow-2xl shadow-black/50 overflow-hidden">
    <a href="#/" data-tab="/" aria-label="Home" class="tab mobile-tab grid place-items-center h-11 rounded-full text-white/60 transition-all">

      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    </a>
    <a href="#/search" data-tab="/search" aria-label="Search" class="tab mobile-tab grid place-items-center h-11 rounded-full text-white/60 transition-all">

      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M16 11h6"/></svg>

      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.4 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.4l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1A2 2 0 1 1 19.6 7l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1h.3a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

  </div>
</nav>
